name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The runner context does not exist yet at this level; the matrix does.
      EXE: ${{ github.workspace }}/build/shaderlab-ls${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format
          # There is no FXC on Linux: HLSL compiles with DXC, installed the way a user would, on the library path.
          mkdir -p "$RUNNER_TEMP/dxc"
          curl -sfL https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/linux_dxc_2026_05_26.x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/dxc"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/dxc/lib" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-format -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress }
          # FXC comes with Windows. The SDK's DXC stands in for a Unity editor's, so the #pragma use_dxc test runs too.
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxcompiler.dll" |
            Sort-Object FullName | Select-Object -Last 1
          if ($dxc) { "SHADERLAB_LS_TEST_DXC=$($dxc.FullName)" >> $env:GITHUB_ENV }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: sh build.sh Release

      # The plugin tests drive Neovim itself, so they need one installed. The stable tag rather than a pinned
      # version: what the plugin has to keep working with is whatever Neovim tells people to run.
      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sfL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Neovim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP nvim.zip
          Invoke-WebRequest https://github.com/neovim/neovim/releases/download/stable/nvim-win64.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'nvim-win64/bin' >> $env:GITHUB_PATH

      # The server's tests, the fuzzing and the plugin's tests, as CMakeLists.txt registers them. ctest passes a run
      # with a skipped test, but Neovim is installed above, so a skip here means it went missing: fail instead.
      - name: Test
        run: |
          ctest --preset Release --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          ! grep -q 'did not run' "$RUNNER_TEMP/ctest.log"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: shaderlab-ls-${{ runner.os }}
          path: ${{ env.EXE }}
